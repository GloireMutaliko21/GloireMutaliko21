name: GitHub Metrics

# Renders a lowlighter/metrics panel into assets/metrics/metrics.svg, which
# README.md then displays.
#
# SETUP (one-off, and it cannot be done from CI):
#   1. Create a classic personal access token with only the `public_repo`
#      scope — https://github.com/settings/tokens. The built-in GITHUB_TOKEN
#      cannot read the account-wide data this action aggregates.
#   2. Store it as the repository secret METRICS_TOKEN:
#        gh secret set METRICS_TOKEN --repo GloireMutaliko21/GloireMutaliko21
#   3. Run the workflow once: gh workflow run metrics.yml
#
# Until that secret exists every step is skipped and the run passes as a no-op,
# so an unconfigured profile never shows a red X on the Actions tab.
#
# The panel is deliberately complementary to the summary cards already in the
# README: no languages plugin here, because the two language donuts cover it.
#
# Two renders, one per colour scheme, selected by a <picture> element in the
# README. metrics has no config_theme input — the classic template is light-only
# — so the dark variant is produced by overriding its palette with extras_css.
# The base rules being overridden are svg{color:#777}, h1,h2,h3{color:#0366d6},
# .field svg{fill:#959da5}, footer{color:#666} and the calendar :root variables.
#
# plugin_isocalendar is deliberately absent: it failed with "Unexpected error"
# on this account, and it duplicates both GitHub's own contribution graph and
# the snake animation directly above it in the README.

on:
  schedule:
    - cron: "30 0 * * *" # Every day at 00:30 UTC, after the snake job
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  # Deliberately false, unlike the snake job: a manual re-dispatch (say, after a
  # GitHub 503) should queue behind the running render, not kill it. Two renders
  # take long enough that cancelling one wastes real time.
  cancel-in-progress: false

jobs:
  metrics:
    name: Render metrics panel
    runs-on: ubuntu-latest
    # Two renders, and the action is at the mercy of GitHub API latency: a single
    # render took 3 minutes on a good day and blew past 15 during an incident.
    timeout-minutes: 30

    steps:
      # `secrets` is not available in a job-level `if`, so the gate lives in a
      # step that exports a boolean the later step reads.
      - name: Check for METRICS_TOKEN
        id: gate
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -n "$METRICS_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::METRICS_TOKEN is not set — skipping. See the setup steps at the top of this workflow."
          fi

      # Pinned to a release tag rather than @latest, which is a moving pointer:
      # a breaking upstream change would otherwise land unannounced.
      - name: Generate metrics (light)
        if: steps.gate.outputs.configured == 'true'
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics/metrics.svg
          committer_branch: ${{ github.event.repository.default_branch }}
          committer_message: "chore: update metrics panel (light) [skip ci]"
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Africa/Kigali
          plugin_followup: yes
          plugin_followup_sections: repositories

      - name: Generate metrics (dark)
        if: steps.gate.outputs.configured == 'true'
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics/metrics-dark.svg
          committer_branch: ${{ github.event.repository.default_branch }}
          committer_message: "chore: update metrics panel (dark) [skip ci]"
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Africa/Kigali
          plugin_followup: yes
          plugin_followup_sections: repositories
          extras_css: |
            svg { background: #0d1117; color: #8b949e; }
            h1, h2, h3 { color: #58a6ff; }
            .field svg { fill: #8b949e; }
            footer { color: #6e7681; }
            :root {
              --color-calendar-graph-day-bg: #161b22;
              --color-calendar-graph-day-border: rgba(255, 255, 255, 0.05);
              --color-calendar-graph-day-L1-bg: #0e4429;
              --color-calendar-graph-day-L2-bg: #006d32;
              --color-calendar-graph-day-L3-bg: #26a641;
              --color-calendar-graph-day-L4-bg: #39d353;
            }
