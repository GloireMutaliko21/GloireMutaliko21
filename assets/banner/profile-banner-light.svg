<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-label="Gloire Mutaliko — Full-stack engineer, TypeScript, Next.js, NestJS and PostgreSQL. Kigali, Rwanda.">
  <title>Gloire Mutaliko — full-stack engineer</title>
  <desc>Profile banner: name, the tagline "Full-stack engineer · TypeScript · Next.js · NestJS · PostgreSQL", open-source contributor at ever-co, and Kigali, Rwanda (CAT, UTC+2).</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0969da"/>
      <stop offset="100%" stop-color="#8250df"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#8250df" stop-opacity="0.02"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#0969da" fill-opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1000" height="230" rx="14" fill="#ffffff"/>
  <rect width="1000" height="230" rx="14" fill="url(#glow)"/>
  <rect x="640" y="0" width="360" height="230" fill="url(#grid)" opacity="0.9"/>
  <rect width="1000" height="230" rx="14" fill="none" stroke="#d1d9e0" stroke-width="1.5"/>
  <rect x="40" y="46" width="5" height="138" rx="2.5" fill="url(#accent)"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="70" y="86" font-size="40" font-weight="700" fill="#1f2328" letter-spacing="-0.6">Gloire Mutaliko</text>
    <text x="70" y="120" font-size="17.5"><tspan font-weight="600" fill="#0969da">Full-stack engineer</tspan><tspan dx="12" fill="#59636e">· TypeScript · Next.js · NestJS · PostgreSQL</tspan></text>
    <text x="70" y="152" font-size="15" fill="#59636e">Open-source contributor at @ever-co — Gauzy ERP/CRM/HRM &amp; Ever Teams</text>
    <text x="70" y="178" font-size="14" fill="#818b98">Kigali, Rwanda · CAT (UTC+2) · Building multi-tenant SaaS, end to end</text>
  </g>

  <g transform="translate(786, 63)" opacity="0.95">
    <rect x="0" y="0" width="104" height="104" rx="26" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <rect x="18" y="18" width="68" height="68" rx="17" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.55"/>
    <rect x="38" y="38" width="28" height="28" rx="8" fill="url(#accent)" opacity="0.85"/>
  </g>
</svg>
